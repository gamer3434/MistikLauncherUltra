name: Publish launcher release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [xml]$project = Get-Content MistikLauncher/MistikLauncher.csproj
          $version = [string]$project.SelectSingleNode("/Project/PropertyGroup/Version").InnerText
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag must match project version' }
          "MISTIK_RELEASE_TAG=v$version" >> $env:GITHUB_ENV
      - name: Validate ordinary build and website
        run: |
          node --test Validation/WebsiteReleaseTests.js Validation/WebsitePrivacyTests.js
          dotnet run --project Validation -c Release -- artifacts/screenshots-ordinary
      - name: Build regular package
        shell: pwsh
        run: ./scripts/Build-Package.ps1
      - name: Build online and offline installers
        shell: pwsh
        run: ./scripts/Build-Installers.ps1
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.MISTIK_RELEASE_TAG }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          # Locally published signed releases take precedence; never replace existing assets.
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) { exit 0 }
          $arguments = @('release', 'create', $env:RELEASE_TAG, "artifacts/MistikLauncher-$version-win-x64.zip", "artifacts/installers/MistikSetup-Online-$version.exe", "artifacts/installers/MistikSetup-Offline-$version.exe", "artifacts/installers/MistikRepair-$version.exe", 'artifacts/installers/SHA256SUMS.txt', '--target', $env:GITHUB_SHA, '--title', "Mistik Launcher $version", '--notes-file', "docs/RELEASE-$version.md")
          if ($version.Contains('-')) { $arguments += '--prerelease' }
          gh @arguments
          if ($LASTEXITCODE) { throw 'Release publication failed' }
