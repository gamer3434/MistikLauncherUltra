name: Validate Windows launcher
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate website release and privacy
        run: node --test Validation/WebsiteReleaseTests.js Validation/WebsitePrivacyTests.js
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate ordinary build
        run: dotnet run --project Validation -c Release -- artifacts/screenshots-ordinary
      - name: Build and validate protected package
        shell: pwsh
        run: ./scripts/Build-Protected.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: mistik-portable
          path: artifacts/MistikLauncher-*-win-x64.zip
          if-no-files-found: error
